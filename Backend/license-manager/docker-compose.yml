services:
  db:
    image: postgres:17
    container_name: license-manager-db
    environment:
      POSTGRES_DB: license_manager
      POSTGRES_USER: license_user
      POSTGRES_PASSWORD: license_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker runs this command repeatedly; "healthy" means the database accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U license_user -d license_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: license-manager-backend
    depends_on:
      db:
        condition: service_healthy   # wait until the database is ready
    environment:
      DB_URL: jdbc:postgresql://db:5432/license_manager   # "db" = the service name above
      DB_USERNAME: license_user
      DB_PASSWORD: license_pass
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploying-123456}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"

  frontend:
    image: nginx:alpine
    container_name: license-manager-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    # Mount your HTML, CSS and JS into nginx's web folder (read only).
    # ../../ is the project root, two folders above this file.
    volumes:
      - ../../index.html:/usr/share/nginx/html/index.html:ro
      - ../../vendors.html:/usr/share/nginx/html/vendors.html:ro
      - ../../licenses.html:/usr/share/nginx/html/licenses.html:ro
      - ../../css:/usr/share/nginx/html/css:ro
      - ../../js:/usr/share/nginx/html/js:ro
      - ../../login.html:/usr/share/nginx/html/login.html:ro
      - ../../account.html:/usr/share/nginx/html/account.html:ro
      - ../../users.html:/usr/share/nginx/html/users.html:ro

volumes:
  pgdata: