spring.application.name=license-manager
server.error.include-message=always

spring.datasource.url=jdbc:postgresql://localhost:5432/license_manager
spring.datasource.username=license_user
spring.datasource.password=license_pass

# Create or update tables automatically from the Java entities (fine for learning)
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Spring runs, so you can see what it does
spring.jpa.show-sql=true