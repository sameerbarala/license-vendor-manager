server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/license_manager}
spring.datasource.username=${DB_USERNAME:license_user}
spring.datasource.password=${DB_PASSWORD:license_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Which web page addresses may call the API (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

# Secret used to sign tokens. Must be at least 32 characters.
# This default is for local development only. Real deployments set JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-123456}
app.jwt.expiration-minutes=60

# The first admin account, created only if the users table is empty.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}