
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
        }

        button {
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>License Manager</h1>

        <p>Total licenses: 20</p>
        <p>Unassigned licenses: 6</p>

        <h2>Vendors</h2>
        <p>GitHub</p>
        <p>Microsoft</p>

        <button onclick="showMessage()">
            Add Vendor
        </button>
    </div>

    <script>
        function showMessage() {
            alert("Vendor management is coming soon!");
        }
    </script>
</body>
</html>
